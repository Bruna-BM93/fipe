<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta FIPE</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="container">
    <header>
      <h1>🚗 Consulta Tabela FIPE</h1>
      <p class="subtitulo">Escolha o veículo e veja o código FIPE e o preço médio, usando a <a href="https://brasilapi.com.br/" target="_blank" rel="noopener">BrasilAPI</a></p>
    </header>

    <!-- Escolha do veículo: Tipo -> Marca -> Modelo -> Ano -->
    <section class="card">
      <h2>Escolha o veículo</h2>
      <div class="passos">
        <label>
          <span>1. Tipo</span>
          <select id="tipoVeiculo">
            <option value="carros">Carros</option>
            <option value="motos">Motos</option>
            <option value="caminhoes">Caminhões</option>
          </select>
        </label>
        <label>
          <span>2. Marca</span>
          <select id="marca" disabled>
            <option value="">Carregando marcas...</option>
          </select>
        </label>
        <label>
          <span>3. Modelo</span>
          <select id="modelo" disabled>
            <option value="">Escolha a marca primeiro</option>
          </select>
        </label>
        <label>
          <span>4. Ano</span>
          <select id="ano" disabled>
            <option value="">Escolha o modelo primeiro</option>
          </select>
        </label>
      </div>
    </section>

    <!-- Indicador de processamento da requisição -->
    <div id="loading" class="loading oculto" role="status" aria-live="polite">
      <div class="spinner"></div>
      <span>Processando requisição...</span>
    </div>

    <div id="erro" class="erro oculto" role="alert"></div>

    <!-- Resultado: código FIPE + dados do carro escolhido -->
    <section id="resultado"></section>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
